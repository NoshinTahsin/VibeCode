<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VibeCode Branch Previews</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
        color: #17211b;
        background: #fffaf2;
      }

      main {
        width: min(720px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 3rem 0;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1.05;
      }

      p {
        color: #526158;
      }

      ul {
        display: grid;
        gap: 0.7rem;
        padding: 0;
        list-style: none;
      }

      a {
        display: block;
        border: 1px solid #d8cdbd;
        border-radius: 8px;
        background: #ffffff;
        color: #671f12;
        font-weight: 700;
        padding: 0.8rem 1rem;
        text-decoration: none;
      }

      a:hover,
      a:focus {
        outline: 4px solid #234f63;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>VibeCode Branch Previews</h1>
      <p>Each link opens the website deployed from that branch.</p>
      <ul>
        <li><a href="version-1/">Version 1</a></li>
        <li><a href="version-2/">Version 2</a></li>
        <li><a href="version-3/">Version 3</a></li>
        <li><a href="version-4a/">Version 4a</a></li>
        <li><a href="version-5/">Version 5</a></li>
        <li><a href="version-6/">Version 6</a></li>
        <li><a href="version-7/">Version 7</a></li>
        <li><a href="version-8/">Version 8</a></li>
        <li><a href="version-9/">Version 9</a></li>
        <li><a href="version-10/">Version 10</a></li>
      </ul>
    </main>
  </body>
</html>
